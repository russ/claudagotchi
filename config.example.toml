# claudagotchi config
#
# Copy to ~/.config/claudagotchi/config.toml (or pass via --config).
# Hosts must resolve through your SSH config with passwordless (key-based) auth,
# since claudagotchi shells out to `ssh`.

# Shorthand: just names, all SSH options come from ~/.ssh/config.
hosts = ["host-a", "host-b"]

# Detailed form: array-of-tables for hosts that need overrides. The two
# styles are independently optional and concatenated in order.
#
# [[host]]
# name          = "weird-box"           # required, also the SSH alias
# hostname      = "192.168.1.100"       # → ssh -o HostName=...
# user          = "deploy"              # → ssh -o User=...
# port          = 2222                  # → ssh -o Port=...
# identity_file = "~/.ssh/id_special"   # → ssh -o IdentityFile=...

# Optional. How often to re-poll each host. Defaults to 3s.
# poll_interval = "3s"

# Optional. Maximum number of sessions to display per host. Sessions beyond
# this cap are summarized as "+N more". Defaults to 6.
# max_sessions = 6

# Optional. Sessions whose last activity is older than this are hidden from
# the dashboard. Defaults to 1h. Use "0s" to disable.
# active_window = "1h"

# Optional. Roster of creatures the dashboard may assign to projects. Each
# project gets a deterministic creature based on a hash of (host, project)
# so the same project always shows the same pet. Omit or leave empty to use
# every built-in creature.
# creatures = ["slime"]
